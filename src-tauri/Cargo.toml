[package]
name = "kortty"
version = "2.0.0"
description = "KorTTY - SSH Terminal Client"
authors = ["General Kor"]
license = "MIT"
repository = "https://github.com/chardonnay/korTTY_rust"
edition = "2021"

[lib]
name = "kortty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
# Keep russh's forked ssh-key crate RSA-free until upstream ships a non-vulnerable RSA path.
internal-russh-forked-ssh-key = { path = "vendor/internal-russh-forked-ssh-key" }
# Backport GHSA-wrw7-89jp-8q8g fix while Tauri 2.11.1 still pulls gtk 0.18/glib 0.18.
glib = { path = "vendor/glib-0.18.5-kortty" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
tokio = { version = "1", features = ["full"] }
russh = { version = "0.60.2", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
zip = "2"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
fs2 = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
glob = "0.3"
thiserror = "2"
anyhow = "1"
figlet-rs = "0.1"
zxcvbn = "3"
portable-pty = "0.9"
printpdf = { version = "0.9.1", default-features = false }
