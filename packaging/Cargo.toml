[package]
name = "kortty-package"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Build-time staging and release archives for kortty"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }
