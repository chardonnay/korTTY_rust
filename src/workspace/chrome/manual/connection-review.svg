<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264">
  <title>Verify the SSH route before opening a terminal</title>
  <desc>A saved target identifies the route. Each jump host and destination has its own host key check. Authentication opens the terminal after those checks.</desc>
  <rect width="720" height="264" rx="12" fill="#111b27"/>
  <g fill="#21354a" stroke="#8bafce" stroke-width="1.5">
    <rect x="20" y="28" width="190" height="88" rx="8"/>
    <rect x="265" y="28" width="190" height="88" rx="8"/>
    <rect x="510" y="28" width="190" height="88" rx="8"/>
    <rect x="265" y="158" width="435" height="70" rx="8"/>
  </g>
  <path d="M219 72h36m-8-8 8 8-8 8m217-8h36m-8-8 8 8-8 8M605 124v25m-8-8 8 8 8-8" fill="none" stroke="#90d1f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f6faff" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="115" y="65">Choose saved target<tspan x="115" dy="25">and route</tspan></text>
    <text x="360" y="65">Verify jump host<tspan x="360" dy="25">when configured</tspan></text>
    <text x="605" y="65">Verify destination<tspan x="605" dy="25">host key</tspan></text>
    <text x="482" y="187">Authenticate and open terminal<tspan x="482" dy="25">on the approved route</tspan></text>
    <text x="115" y="184" font-size="14" fill="#c6d9e9">A changed key<tspan x="115" dy="22">requires review.</tspan></text>
  </g>
</svg>
