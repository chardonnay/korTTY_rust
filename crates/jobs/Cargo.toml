[package]
name = "kortty-jobs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Job dependency validation, execution state, and diagrams for kortty"

[dependencies]
jiff = { version = "0.2.39", default-features = false, features = ["serde", "std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
kortty-diagram = { path = "../diagram" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
