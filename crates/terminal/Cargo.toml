[package]
name = "kortty-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native terminal state and escape sequence handling for kortty"

[dependencies]
base64 = "0.22.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
png = "0.18.1"
unicode-width = "0.2.2"
vte = { version = "0.15", default-features = false }
