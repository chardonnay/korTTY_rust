[package]
name = "kortty-vault"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native encrypted credential storage for kortty"

[dependencies]
# These branches use RustCrypto's subtle implementation without cmov's inline assembly.
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
getrandom = "0.4"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std", "use-libc"] }

[target.'cfg(windows)'.dependencies]
keyring-core = { version = "1.1", default-features = false }
kortty-files = { path = "../files" }
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
oo7 = { version = "0.7.3", default-features = false, features = ["async-std", "native_crypto"] }
