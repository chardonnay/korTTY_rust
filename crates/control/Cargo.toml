[package]
name = "kortty-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local JSON-RPC control transport and CLI for kortty"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
async-channel = "2.5"
base64 = "0.22"
getrandom = "0.4"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
subtle = "2.6"
zeroize = { version = "1.9", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "use-libc"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
kortty-pty = { path = "../pty" }
