[package]
name = "kortty-server-archive"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native server-side archive inspection and extraction for kortty"

[features]
default = ["decoder"]
decoder = ["dep:bzip2", "dep:flate2", "dep:getrandom", "dep:globset", "dep:hex", "dep:kortty-files", "dep:lzma-rust2", "dep:rustix", "dep:sevenz-rust2", "dep:tar", "dep:zip"]

[[bin]]
name = "kortty-server-archive"
path = "src/main.rs"
required-features = ["decoder"]

[dependencies]
bzip2 = { version = "0.6.1", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sevenz-rust2 = { version = "=0.25.0", path = "../../vendor/sevenz-rust2", default-features = false, features = ["aes256", "compress"], optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2", "bzip2"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
getrandom = { version = "0.4", optional = true }
globset = { version = "0.4.20", default-features = false, optional = true }
hex = { version = "0.4", optional = true }
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "use-libc"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
kortty-files = { path = "../files", optional = true }

[dev-dependencies]
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
sevenz-rust2 = { version = "=0.25.0", path = "../../vendor/sevenz-rust2", default-features = false, features = ["compress", "aes256"] }
zip = { version = "=9.4.1", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
