name: Native Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS can exceed an hour across the cold test and release builds.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install Linux TLS build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Identify Rust compiler for the Cargo cache
        id: rust-cache-key
        shell: bash
        run: |
          compiler=$(rustc +stable -vV | git hash-object --stdin)
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo development cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cargo-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/debug
          key: cargo-dev-v1-${{ matrix.os }}-${{ steps.rust-cache-key.outputs.compiler }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}
          restore-keys: cargo-dev-v1-${{ matrix.os }}-${{ steps.rust-cache-key.outputs.compiler }}-

      - name: Check lints
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings

      - name: Run macOS tests with zsh
        if: runner.os == 'macOS'
        run: bash scripts/with-scratch.sh --zsh-tests cargo +stable test --locked --workspace --all-targets

      - name: Run Linux tests
        if: runner.os == 'Linux'
        env:
          SHELL: /bin/sh
        run: bash scripts/with-scratch.sh cargo +stable test --locked --workspace --all-targets

      - name: Run Windows tests
        if: runner.os == 'Windows'
        env:
          SHELL: /bin/sh
        shell: pwsh
        run: |
          $scratchRoot = Get-Item -LiteralPath $env:RUNNER_TEMP
          $scratchPath = Join-Path $scratchRoot.FullName ("kortty-tests-" + [Guid]::NewGuid().ToString("N"))
          $scratch = New-Item -ItemType Directory -Path $scratchPath
          try {
            $env:TEMP = $scratch.FullName
            $env:TMP = $scratch.FullName
            $env:LOCALAPPDATA = $scratch.FullName
            $env:APPDATA = Join-Path $scratch.FullName "roaming"
            New-Item -ItemType Directory -Path $env:APPDATA | Out-Null
            cargo +stable test --locked --workspace --all-targets
            exit $LASTEXITCODE
          } finally {
            $scratch = Get-Item -LiteralPath $scratchPath
            if ($scratch.Parent.FullName -ne $scratchRoot.FullName -or
                ($scratch.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Unexpected test scratch directory: $scratchPath"
            }
            Remove-Item -LiteralPath $scratch.FullName -Recurse -Force
          }

      # Publish the successful dev build before cleaning it. PRs can restore the default branch's cache.
      - name: Save Cargo development cache
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ci/cargo-cache') && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-cache-paths
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Remove development build before release build
        run: cargo +stable clean --profile dev

      - name: Build native release
        if: runner.os != 'Windows'
        env:
          KORTTY_AI_CATALOG_PUBLIC_KEY: ${{ vars.KORTTY_AI_CATALOG_PUBLIC_KEY }}
        run: cargo +stable build --locked --workspace --release

      - name: Stage native release package
        if: runner.os != 'Windows'
        run: cargo +stable run --locked --release -p kortty-package

      - name: Build and stage native Windows release
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          KORTTY_AI_CATALOG_PUBLIC_KEY: ${{ vars.KORTTY_AI_CATALOG_PUBLIC_KEY }}
        run: |
          $target = (rustc +stable -vV | Select-String '^host: ').Line.Substring(6)
          cargo +stable build --locked --workspace --release --target $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binDir = "target/$target/release"
          & "./$binDir/kortty-package.exe" --target $target --bin-dir $binDir
          exit $LASTEXITCODE
